services:
  postgres:
    # pgvector/pgvector:pg16 is postgres:16 with the `vector` extension
    # preinstalled — migrations 000004/000005 CREATE EXTENSION vector and
    # build an HNSW index, which plain postgres:16-alpine can't satisfy.
    image: pgvector/pgvector:pg16
    container_name: pegasus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pegasus
      POSTGRES_USER: pegasus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pegasus -d pegasus"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.0
    container_name: pegasus-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations
    command:
      [
        "-path=/migrations",
        "-database", "postgres://pegasus:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/pegasus?sslmode=disable",
        "up"
      ]
    restart: "no"

  # Daily pg_dump of the pegasus database, gzipped and written to a host
  # bind mount (./backups) rather than the postgres_data named volume — a
  # backup that lives in the same volume as the live data doesn't survive a
  # volume-level failure. See README.md "Backups" for restore instructions.
  backup:
    image: postgres:16-alpine
    container_name: pegasus-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: pegasus
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: pegasus
      BACKUP_RETENTION_DAYS: "14"
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]

  # The Pegasus service (cmd/pegasus). Settings come from .env (env_file,
  # the same .env the other services read POSTGRES_PASSWORD from — no
  # secret appears in this file); only non-secret container-specific
  # overrides live under `environment`. See README.md "Configuration".
  pegasus:
    build: .
    container_name: pegasus
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      PEGASUS_DB_HOST: postgres
      PEGASUS_DB_PORT: "5432"
      # Listen on all interfaces INSIDE the container; the host-side
      # publish below is loopback-only.
      PEGASUS_HTTP_ADDR: 0.0.0.0:8095
      # Costguard runs on the host, reached via host-gateway (extra_hosts).
      # Overridable from .env.
      PEGASUS_COSTGUARD_URL: ${PEGASUS_COSTGUARD_URL:-http://host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8095:8095"
    # Must exceed PEGASUS_SHUTDOWN_TIMEOUT (default 60s). Docker's default
    # of 10s would SIGKILL the process in the middle of its final flush.
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "/pegasus", "healthcheck"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 3

volumes:
  postgres_data:
